name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - "shell-app/**"
      - "mfe-password/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy-mfe:
    name: Build & Deploy MFE Password
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mfe-password/package-lock.json

      - name: Install dependencies
        working-directory: mfe-password
        run: npm ci

      - name: Build (static export)
        working-directory: mfe-password
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_GATEWAY_URL }}
          NEXT_PUBLIC_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          NEXT_PRIVATE_LOCAL_WEBPACK: "true"
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync mfe-password/out s3://${{ secrets.MFE_S3_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync mfe-password/out s3://${{ secrets.MFE_S3_BUCKET }} \
            --delete \
            --cache-control "no-cache" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.MFE_CF_DISTRIBUTION_ID }} \
            --paths "/mfe/*"

  deploy-shell:
    name: Build & Deploy Shell App
    runs-on: ubuntu-latest
    needs: deploy-mfe  # shell depende do remoteEntry.js do mfe já estar no S3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell-app/package-lock.json

      - name: Install dependencies
        working-directory: shell-app
        run: npm ci

      - name: Build (static export)
        working-directory: shell-app
        env:
          NEXT_PUBLIC_MFE_PASSWORD_URL: ${{ secrets.MFE_CLOUDFRONT_URL }}
          NEXT_PRIVATE_LOCAL_WEBPACK: "true"
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync shell-app/out s3://${{ secrets.SHELL_S3_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync shell-app/out s3://${{ secrets.SHELL_S3_BUCKET }} \
            --delete \
            --cache-control "no-cache" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.SHELL_CF_DISTRIBUTION_ID }} \
            --paths "/*"
